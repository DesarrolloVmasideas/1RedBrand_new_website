# 1RedBrand: reglas para nginx (el servidor actual de www.1redbrand.com es nginx,
# que no lee .htaccess). Pegar dentro del bloque server { } del sitio, o pedírselo al hosting.
# Si después se agrega Google Analytics, Google Ads, Meta Pixel o un captcha,
# hay que sumar sus dominios a la Content-Security-Policy.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
server_tokens off;

# ---- Idioma por país del visitante (assets/js/lang.js) ----
# El servidor manda una cookie "rb-geo" con el código ISO del país (MX, US…);
# lang.js la lee antes de pintar la página: país hispanohablante → español, otro → inglés.
# Sin esta cookie el sitio usa el idioma del navegador, así que se puede activar después.
#
# Opción A, nginx con el módulo GeoIP2 (libnginx-mod-http-geoip2) y la base gratuita
# GeoLite2-Country de MaxMind (requiere cuenta en maxmind.com; actualizar la base cada mes):
#   en el bloque http { }:
#     geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb { $rb_country default=XX country iso_code; }
#   y descomentar la línea add_header de abajo.
#
# Opción B, si el dominio pasa por Cloudflare (activar "IP Geolocation" en Network):
#   en el bloque http { }:
#     map $http_cf_ipcountry $rb_country { default $http_cf_ipcountry; "" XX; }
#   y descomentar la línea add_header de abajo.
#
# add_header Set-Cookie "rb-geo=$rb_country; Path=/; Max-Age=86400; SameSite=Lax; Secure" always;
autoindex off;

index index.html;
error_page 404 /404.html;

# URLs limpias: /plataforma/ sirve /plataforma/index.html
location / { try_files $uri $uri/ =404; }

# Archivos ocultos (.git, .htaccess, .claude…) nunca se sirven, salvo /.well-known/
location ~ /\.(?!well-known/) { return 404; }

# Carpetas y archivos de trabajo que no deben ser públicos
location ~ ^/(tools|dist)(/|$) { return 404; }
location ~ \.(py|md|bak|log)$ { return 404; }
location ~ ^/(_headers|nginx-1redbrand\.conf|README\.md)$ { return 404; }

# Caché larga para recursos versionados (?v=N)
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  # nginx no hereda add_header dentro de location: se repiten las de seguridad
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

# Redirección a https://www (va en los bloques server de :80 y del dominio sin www):
#   return 301 https://www.1redbrand.com$request_uri;
